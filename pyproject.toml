[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-arbiter"
version = "1.1.0"
description = "ARBITER: Attentive Relational Bidirectional Impartial Typed Encoder for Reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Ichrak Mokhtari"},
    {name = "Seif Attoui"}
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.19.0",
    "safetensors>=0.4.0",
]
[project.optional-dependencies]
finetuning = [
    "datasets>=3.0.0",
    "tensorboard>=2.15.0",
    "nbformat>=5.9.0",
    "jupyterlab>=4.0.0",
]
benchmark = [
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
    "datasets>=3.0.0",
]

dev = [
    "pytest>=8.0",
    "build>=1.2",
    "nbformat>=5.9",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: requires downloaded ARBITER weights"]

[tool.setuptools.packages.find]
include = ["arbiter*"]
