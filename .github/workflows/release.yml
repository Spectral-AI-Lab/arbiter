name: Release & Publish (PyPI + GHCR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish package to PyPI'
        required: true
        type: boolean
        default: true
      publish_docker:
        description: 'Build and publish Docker images to GHCR'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write  # Required for PyPI OIDC Trusted Publishing

jobs:
  test:
    name: Test Suite & Doc Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,serve]'
      - name: Run fast unit tests
        run: python -m pytest tests -m 'not integration' -q
      - name: Check documentation integrity
        run: python scripts/check_docs.py

  publish-pypi:
    name: Publish to PyPI
    needs: test
    if: github.event_name == 'push' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spectral-arbiter
    permissions:
      id-token: write  # for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build source distribution and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-docker:
    name: Build & Publish Containers (GHCR)
    needs: test
    if: github.event_name == 'push' || inputs.publish_docker == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/spectral-ai-lab/arbiter-serve:cpu
            ghcr.io/spectral-ai-lab/arbiter-serve:1.0.0-cpu

      - name: Build and push GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/spectral-ai-lab/arbiter-serve:gpu
            ghcr.io/spectral-ai-lab/arbiter-serve:latest
            ghcr.io/spectral-ai-lab/arbiter-serve:1.0.0-gpu
