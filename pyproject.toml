[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "1.0.0"
description = "ARBITER: Attentive Relational Bidirectional Impartial Typed Encoder for Reasoning"
readme = "checkpoints/arbiter-272m/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Seif Attoui"},
    {name = "Ichrak Mokhtari"}
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.19.0",
    "safetensors>=0.4.0",
]
[project.optional-dependencies]
finetuning = [
    "datasets>=3.0.0",
    "tensorboard>=2.15.0",
    "nbformat>=5.9.0",
    "jupyterlab>=4.0.0",
]
benchmark = [
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
    "datasets>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["arbiter*"]
